; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Sunset_City_Power_Panel]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = pkerspe/ESP-FlexyStepper@^1.5.1
build_src_filter = -<*> +<PowerPanel.cpp> ;add the file you want, exclude everything else

[env:Sunset_City_Stepper_Panel]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = pkerspe/ESP-FlexyStepper@^1.5.1
build_src_filter = -<*> +<StepperPanel.cpp> ;add the file you want, exclude everything else

[env:ESP32-C3_SuperMini_Stepper_Controller]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_rts = 0
monitor_dtr = 0
monitor_speed = 115200
lib_deps = pkerspe/ESP-FlexyStepper@^1.5.1
build_src_filter = -<*> +<StepperController.cpp> ;add the file you want, exclude everything else
